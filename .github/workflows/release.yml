name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: hoard-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: macos-14
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Require update signing key
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: test -n "$MYGO_UPDATER_PRIVATE_KEY"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Validate version, changelog and commit
        id: version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          bun scripts/prepare-release.ts
      - run: bun install --frozen-lockfile
      - name: Check Go formatting
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - run: go test ./...
      - run: go vet ./...
      - run: bun test scripts/
      - run: bun run generate
      - run: bun run typecheck

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin/arm64, target: darwin-arm64, os: macos-14 }
          - { platform: darwin/amd64, target: darwin-amd64, os: macos-14 }
          - { platform: windows/amd64, target: windows-amd64, os: ubuntu-24.04 }
          - { platform: windows/arm64, target: windows-arm64, os: ubuntu-24.04 }
          - { platform: linux/amd64, target: linux-amd64, os: ubuntu-24.04 }
          - { platform: linux/arm64, target: linux-arm64, os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Install Windows packaging tool
        if: startsWith(matrix.target, 'windows-')
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build application and installer
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bun x --no-install mygo build -platform "$TARGET_PLATFORM"
      - name: Collect platform release files
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: bun scripts/release-assets.ts collect
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: .agent/release-assets/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: .agent/release-assets
          merge-multiple: true
      - name: Verify complete artifact set and generate checksums
        run: bun scripts/release-assets.ts finalize
      - name: Extract release notes
        run: bun scripts/prepare-release.ts
      - name: Upload release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            prerelease=()
            if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Hoard $RELEASE_VERSION" --notes-file .agent/release-notes.md "${prerelease[@]}"
          fi
          gh release edit "$RELEASE_TAG" --notes-file .agent/release-notes.md
          gh release upload "$RELEASE_TAG" .agent/release-assets/* --clobber
