name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run test:site
      - run: bun run typecheck:site
      - run: bun run build:site
        env:
          NEXT_PUBLIC_SITE_URL: https://hoard.example

  checks:
    name: Checks
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test Go packages
        run: go test ./...
      - name: Analyze Go packages
        run: go vet ./...
      - name: Test release scripts
        run: bun test scripts/
      - name: Generate frontend bindings
        run: bun run generate
      - name: Check TypeScript
        run: bun run typecheck
      - name: Check website APP demo types
        run: bun run typecheck:demo
      - name: Verify frontend build
        run: bun run build:web
